name: Daily Generate

on:
  schedule:
    # 12:00 UTC = 7:00 AM Toronto on EST (UTC-5, Nov 1 2026 to Mar 14 2027).
    # On EDT (UTC-4, from Mar 14 2027) this fires at 8:00 AM; change to
    # '0 11 * * *' then to keep 7:00 AM.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Backfill date (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''
        type: string

# One run at a time, so backfills and the daily run never race on the push to main.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  generate:
    name: Generate cartoon concept
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.gen.outputs.skipped }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Generate cartoon concept
        id: gen
        working-directory: pipeline
        env:
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            python generate.py --date "$BACKFILL_DATE"
          else
            python generate.py
          fi

      # TODO: Instagram posting step
      # - name: Post to Instagram
      #   working-directory: pipeline
      #   run: python post_instagram.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: success() && steps.gen.outputs.skipped != 'true'
        with:
          name: pending-post-${{ github.run_number }}
          path: |
            pipeline/pending_post.json
            pipeline/pending_post_*.json
            pipeline/output_images/*.jpg
          retention-days: 7

      - name: Commit pending_post to daily-output branch
        if: success() && steps.gen.outputs.skipped != 'true'
        run: |
          git config user.name "Neural Strip Bot"
          git config user.email "bot@neuralstrip.com"
          git fetch origin
          git checkout -B daily-output
          git add -f pipeline/pending_post.json
          git add -f pipeline/pending_post_*.json
          git add -f pipeline/output_images/ 2>/dev/null || true
          git commit -m "daily: $(date +%Y-%m-%d) cartoon concept + image"
          git push origin daily-output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish cartoon to main
    needs: generate
    if: needs.generate.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch today's files from daily-output branch
        run: |
          git fetch origin daily-output
          mkdir -p pipeline/output_images
          # Use git show (no index side effects) so only website/* lands on main.
          git show origin/daily-output:pipeline/pending_post.json > pipeline/pending_post.json
          DATE=$(python -c "import json; p = json.load(open('pipeline/pending_post.json')); print(p.get('cartoon_date') or p['generated_at'][:10])")
          git show "origin/daily-output:pipeline/output_images/${DATE}.jpg" > "pipeline/output_images/${DATE}.jpg"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Publish to website
        id: publish
        env:
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            DATE=$(python pipeline/publish.py --date "$BACKFILL_DATE")
          else
            DATE=$(python pipeline/publish.py)
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Commit and push to main
        id: commit
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "Neural Strip Bot"
          DATE="${{ steps.publish.outputs.date }}"
          git add "website/images/${DATE}.jpg"
          git add website/cartoons.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "daily: publish ${DATE} cartoon"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes made with GITHUB_TOKEN don't cascade into other workflows,
      # so dispatch the Pages deploy explicitly.
      - name: Trigger GitHub Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  # Runs last, only when generate or publish failed: opens an issue with the
  # error lines so a broken pipeline is noticed the same day.
  alert:
    name: Open issue on failure
    needs: [generate, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read

    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          DATE="${BACKFILL_DATE:-$(date -u +%Y-%m-%d)}"
          ERRORS=""
          for JOB_ID in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            ERRORS+=$(gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" \
              | grep -E 'ERROR|##\[error\]|Traceback|Error:|Bad reply|Raw reply' \
              | sed -E 's/^[0-9-]+T[0-9:.]+Z //' | tail -n 40)
            ERRORS+=$'\n'
          done
          if [ -z "${ERRORS//[[:space:]]/}" ]; then
            ERRORS="(no error lines found, see the run log)"
          fi
          {
            echo "Run: $RUN_URL"
            [ -n "$BACKFILL_DATE" ] && echo "Backfill date: $BACKFILL_DATE"
            echo
            echo "Error lines:"
            echo '```'
            echo "$ERRORS"
            echo '```'
          } > body.md
          gh issue create --repo "$REPO" --title "Daily pipeline failed $DATE" --body-file body.md
