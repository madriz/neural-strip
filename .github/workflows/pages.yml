name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', 'tools/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Stamp the shared nav, footer and head tags (tools/partials/) into every page,
      # so a page edited without running the script still deploys with the current ones.
      # Builds rather than checks, so it can never block a cartoon deploy.
      - name: Stamp shared partials
        run: python3 tools/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
